name: hstore

services:
  app:
    image: ${HSTORE_IMAGE:-ghcr.io/chouhx/hstore:latest}
    container_name: hstore
    restart: unless-stopped
    ports:
      - "${HSTORE_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      FAKA_ADDR: "0.0.0.0"
      FAKA_DB_PATH: "/data/faka.db"
      TZ: "${TZ:-Asia/Shanghai}"
      # 绕过上游 WAF：经家宽 SOCKS5 隧道出网（见 docs/waf-tunnel.md）
      HTTPS_PROXY: "${HTTPS_PROXY:-socks5://172.20.0.1:18080}"
      HTTP_PROXY: "${HTTP_PROXY:-socks5://172.20.0.1:18080}"
      # 只有上游天启需要走代理。支付宝 / 邮件 / Bybit 必须直连：
      # 隧道只放行天启域名，Bybit 走代理会被直接关闭，导致链上已到账却查不到。
      NO_PROXY: "127.0.0.1,localhost,172.20.0.1,.alipay.com,.alipayobjects.com,.aliyuncs.com,.qq.com,.microsoft.com,.office.com,.outlook.com,.live.com,.bybit.com"
    volumes:
      - hstore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hstore-data:
    name: hstore-data
