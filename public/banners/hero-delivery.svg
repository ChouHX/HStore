<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="280" height="220" fill="none">
  <defs>
    <linearGradient id="dlPanel" x1="40" y1="34" x2="232" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="dlCoin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <circle cx="222" cy="54" r="34" fill="#6EE7B7" fill-opacity="0.2"/>
  <circle cx="52" cy="168" r="28" fill="#2DD4BF" fill-opacity="0.2"/>

  <!-- Dispatch terminal card -->
  <rect x="48" y="40" width="178" height="128" rx="18" fill="url(#dlPanel)" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="1.4"/>
  <rect x="66" y="60" width="142" height="26" rx="8" fill="#064E3B" fill-opacity="0.38"/>
  <circle cx="80" cy="73" r="4.5" fill="#34D399"/>
  <rect x="92" y="70" width="64" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="174" y="68" width="24" height="10" rx="5" fill="#34D399" fill-opacity="0.3"/>

  <!-- Card lines -->
  <rect x="66" y="96" width="142" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="76" y="104" width="84" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.72"/>
  <path d="M188 107l4 4 8-8" stroke="#6EE7B7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="66" y="126" width="142" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="76" y="134" width="70" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.62"/>
  <path d="M188 137l4 4 8-8" stroke="#6EE7B7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Alipay / CNY coin -->
  <circle cx="52" cy="158" r="22" fill="#FFFFFF" fill-opacity="0.95"/>
  <circle cx="52" cy="158" r="17" fill="#0EA5E9" fill-opacity="0.15"/>
  <text x="52" y="164" text-anchor="middle" fill="#0284C7" font-family="system-ui,sans-serif" font-size="18" font-weight="800">¥</text>

  <!-- Floating USDT coin -->
  <circle cx="226" cy="152" r="24" fill="url(#dlCoin)" stroke="#FFFFFF" stroke-width="2"/>
  <text x="226" y="159" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="18" font-weight="800">₮</text>

  <!-- VIP Discount pill -->
  <rect x="148" y="22" width="104" height="32" rx="16" fill="#FEF3C7"/>
  <path d="M163 42l3-9 5 5 5-7 5 7 5-5 3 9h-26z" fill="#D97706"/>
  <text x="195" y="42" fill="#92400E" font-family="system-ui,sans-serif" font-size="11" font-weight="700">VIP 折上折</text>
