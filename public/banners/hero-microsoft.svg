<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="280" height="220" fill="none">
  <defs>
    <linearGradient id="msCard" x1="28" y1="26" x2="226" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="msFlap" x1="72" y1="54" x2="196" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="msBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <circle cx="216" cy="48" r="38" fill="#93C5FD" fill-opacity="0.22"/>
  <circle cx="58" cy="172" r="28" fill="#38BDF8" fill-opacity="0.18"/>

  <!-- Back token card -->
  <g transform="rotate(-6 118 96)">
    <rect x="36" y="34" width="154" height="102" rx="16" fill="url(#msCard)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="52" y="52" width="46" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.65"/>
    <rect x="52" y="68" width="98" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="52" y="82" width="76" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.28"/>
    <circle cx="166" cy="56" r="10" fill="#60A5FA" fill-opacity="0.45"/>
    <path d="M162 56l3 3 6-6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Outlook envelope card -->
  <rect x="68" y="64" width="166" height="112" rx="18" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.48" stroke-width="1.4"/>
  <rect x="82" y="78" width="138" height="84" rx="12" fill="#0F172A" fill-opacity="0.24"/>
  <path d="M86 84l65 44 65-44" stroke="url(#msFlap)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 156l44-34M216 156l-44-34" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/>

  <!-- OAuth2 dual-token floating pill -->
  <rect x="148" y="28" width="108" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.94"/>
  <circle cx="168" cy="46" r="10" fill="url(#msBadge)"/>
  <path d="M164 46.5l2.6 2.6 5.4-5.6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="184" y="39" width="56" height="6" rx="3" fill="#1E3A8A"/>
  <rect x="184" y="49" width="38" height="5" rx="2.5" fill="#60A5FA"/>

  <!-- Instant pickup code chip -->
  <rect x="26" y="146" width="118" height="42" rx="12" fill="#0B1F52" fill-opacity="0.72" stroke="#93C5FD" stroke-opacity="0.55" stroke-width="1.2"/>
  <circle cx="46" cy="167" r="6" fill="#34D399"/>
  <rect x="60" y="158" width="36" height="5" rx="2.5" fill="#93C5FD" fill-opacity="0.85"/>
  <text x="60" y="177" fill="#FFFFFF" font-family="ui-monospace,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.5">849201</text>

  <!-- Sparkles -->
  <circle cx="48" cy="44" r="3" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="250" cy="144" r="3.5" fill="#BAE6FD" fill-opacity="0.85"/>
  <circle cx="236" cy="186" r="2.2" fill="#FFFFFF" fill-opacity="0.6"/>
</svg>

